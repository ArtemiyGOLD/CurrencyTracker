<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurrencyTracker</title>
    <!-- Подключение иконки сайта -->
    <link rel="icon" href="Images/ico.png" type="image/x-icon">
    <style>
        /* Основные стили для страницы */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* Светлый фон для контраста */
        }

        /* Стили для заголовка */
        #header {
            width: 100%;
            background-color: #007bff; /* Синий фон */
            color: white;
            padding: 10px 0;
            text-align: center;
            font-size: 24px;
        }

        /* Стили для навигационного меню */
        #nav {
            width: 100%;
            background-color: #0056b3; /* Темно-синий фон */
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        #nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        /* Контейнер для списка валют, по умолчанию скрыт */
        #currencyListContainer {
            display: none;
        }

        /* Стили для списка валют */
        #currencyList {
            margin: 20px;
            width: 90%;
            max-width: 600px;
            border: 1px solid #ddd;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .currency-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .currency-item:last-child {
            border-bottom: none;
        }

        /* Стили для блока конвертера валют */
        #converter {
            margin: 20px;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Стили для элементов формы конвертера */
        #converter label {
            margin-right: 10px;
        }

        #converter input, #converter select, #converter button {
            margin: 5px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Стили для кнопки конвертации */
        #converter button {
            background-color: #007bff;
            color: white;
            border: none;
        }

        #converter button:hover {
            background-color: #0056b3; /* Цвет кнопки при наведении */
        }

        /* Стили для нижнего колонтитула */
        #footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        /* Адаптивные стили для мобильных устройств */
        @media (max-width: 768px) {
            #nav {
                flex-direction: column;
            }

            #nav a {
                padding: 10px;
                font-size: 20px;
            }

            #currencyList, #converter {
                width: 100%;
                padding: 10px;
            }

            #converter input, #converter select, #converter button {
                width: calc(100% - 20px);
                margin-bottom: 10px;
            }

            #converter button {
                font-size: 16px;
            }
        }

        /* Стили для рекламных баннеров */
        .ad-banner {
            width: 100%;
            max-width: 600px;
            margin: 10px auto;
            padding: 10px;
            text-align: center;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <!-- Заголовок страницы -->
    <div id="header">CurrencyTracker</div>

    <!-- Навигационное меню -->
    <div id="nav">
        <a href="#" onclick="showSection('currencyListContainer')">Список валют</a>
        <a href="#" onclick="showSection('chartsContainer')">Графики</a>
        <a href="#" onclick="showSection('converter')">Конвертер</a>
        <a href="#" onclick="showSection('contactsContainer')">Контакты</a>
    </div>

    <!-- Рекламный баннер в верхней части страницы -->
    <div class="ad-banner">
        <!-- Код для отображения рекламы -->
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="XXXXXXX"
             data-ad-format="auto"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- Контейнер для списка валют -->
    <div id="currencyListContainer">
        <div id="currencyList">
            <div class="currency-item">
                <span>USD/EUR</span>
                <span>0.85</span>
            </div>
            <div class="currency-item">
                <span>GBP/USD</span>
                <span>1.39</span>
            </div>
            <div class="currency-item">
                <span>JPY/GBP</span>
                <span>0.0073</span>
            </div>
        </div>
    </div>

    <!-- Контейнер для конвертера валют -->
    <div id="converter">
        <h2>Конвертер валют</h2>
        <label for="amount">Сумма:</label>
        <input type="number" id="amount" placeholder="Введите сумму">
        <label for="fromCurrency">Из:</label>
        <select id="fromCurrency"></select>
        <label for="toCurrency">В:</label>
        <select id="toCurrency"></select>
        <button onclick="convertCurrency()">Конвертировать</button>
        <p id="conversionResult"></p>
    </div>

    <!-- Контейнер для контактной информации -->
    <div id="contactsContainer" style="display:none;">
        <h2>Контакты</h2>
        <p>Telegram: <a href="https://t.me/Artemonski16" target="_blank">@Artemonski16</a></p>
        <p>Telegram-канал: <a href="https://t.me/koder_16" target="_blank">@koder_16</a></p>
    </div>

    <!-- Рекламный баннер в нижней части страницы -->
    <div class="ad-banner">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="XXXXXXX"
             data-ad-format="auto"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- Нижний колонтитул страницы -->
    <div id="footer">© 2025 CurrencyTracker</div>

    <script>
        // Функция для отображения выбранного раздела
        function showSection(sectionId) {
            document.getElementById('currencyListContainer').style.display = 'none';
            document.getElementById('converter').style.display = 'none';
            document.getElementById('contactsContainer').style.display = 'none';
            document.getElementById(sectionId).style.display = 'block';
        }

        // Асинхронная функция для получения курсов валют
        async function fetchExchangeRates() {
            try {
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                updateCurrencyList(data.rates);
                populateCurrencyOptions(data.rates);
            } catch (error) {
                console.error('Ошибка при получении данных:', error);
            }
        }

        // Функция для обновления списка валют
        function updateCurrencyList(rates) {
            const currencyList = document.getElementById('currencyList');
            currencyList.innerHTML = '';
            for (const [currency, rate] of Object.entries(rates)) {
                const currencyItem = document.createElement('div');
                currencyItem.className = 'currency-item';
                currencyItem.innerHTML = `<span>USD/${currency}</span><span>${rate.toFixed(2)}</span>`;
                currencyList.appendChild(currencyItem);
            }
        }

        // Функция для заполнения выпадающих списков валют
        function populateCurrencyOptions(rates) {
            const fromCurrency = document.getElementById('fromCurrency');
            const toCurrency = document.getElementById('toCurrency');
            fromCurrency.innerHTML = '';
            toCurrency.innerHTML = '';
            for (const currency in rates) {
                const option1 = document.createElement('option');
                option1.value = currency;
                option1.textContent = currency;
                fromCurrency.appendChild(option1);
                const option2 = option1.cloneNode(true);
                toCurrency.appendChild(option2);
            }
        }

        // Функция для конвертации валюты
        function convertCurrency() {
            const amount = document.getElementById('amount').value;
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;

            if (!amount || !fromCurrency || !toCurrency) {
                document.getElementById('conversionResult').textContent = 'Пожалуйста, заполните все поля.';
                return;
            }

            fetch(`https://api.exchangerate-api.com/v4/latest/${fromCurrency}`)
                .then(response => response.json())
                .then(data => {
                    const rate = data.rates[toCurrency];
                    const result = amount * rate;
                    document.getElementById('conversionResult').textContent = `${amount} ${fromCurrency} = ${result.toFixed(2)} ${toCurrency}`;
                })
                .catch(error => {
                    console.error('Ошибка при конвертации:', error);
                    document.getElementById('conversionResult').textContent = 'Ошибка при конвертации валют.';
                });
        }

        // При загрузке страницы вызывается функция для получения курсов валют, а также устанавливается интервал для их обновления каждые 10 минут
        window.onload = function() {
            fetchExchangeRates();
            setInterval(fetchExchangeRates, 10 * 60 * 1000); // Обновление каждые 10 минут
        };
    </script>
</body>
</html>
