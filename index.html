<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurrencyTracker</title>
    <link rel="icon" href="Images/ico.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: #333;
            transition: background-color 0.3s ease;
        }

        #header {
            width: 100%;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 15px 0;
            text-align: center;
            font-size: 28px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #nav {
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: #0056b3;
        }

        #nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 20px;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        #nav a:hover {
            background-color: #007bff;
        }

        section {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        section.active {
            display: block;
            opacity: 1;
        }

        #currencyList {
            margin: 20px;
            width: 90%;
            max-width: 600px;
            border: 1px solid #ddd;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .currency-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.3s ease;
        }

        .currency-item:hover {
            background-color: #f0f0f0;
        }

        .currency-item:last-child {
            border-bottom: none;
        }

        #converter {
            margin: 20px;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.5s ease;
        }

        #converter:hover {
            transform: translateY(-5px);
        }

        #converter label {
            margin-right: 10px;
            font-weight: bold;
        }

        #converter input, #converter select, #converter button {
            margin: 5px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        #converter button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.5s ease;
        }

        #converter button:hover {
            background-color: #0056b3;
        }

        #footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 768px) {
            #nav {
                flex-direction: column;
            }

            #nav a {
                padding: 10px;
                font-size: 20px;
            }

            #currencyList, #converter {
                width: 100%;
                padding: 10px;
            }

            #converter input, #converter select, #converter button {
                width: calc(100% - 20px);
                margin-bottom: 10px;
            }

            #converter button {
                font-size: 16px;
            }
        }

        .ad-banner {
            width: 100%;
            max-width: 600px;
            margin: 10px auto;
            padding: 10px;
            text-align: center;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 15px;
        }

        #chartsContainer {
            margin: 20px;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        #timer-info {
            color: #888;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="header">CurrencyTracker</div>

    <div id="nav">
        <a href="#" onclick="showSection('currencyListContainer')">Список валют</a>
        <a href="#" onclick="showSection('chartsContainer')">Графики</a>
        <a href="#" onclick="showSection('converter')">Конвертер</a>
        <a href="#" onclick="showSection('contactsContainer')">Контакты</a>
    </div>

    <div class="ad-banner">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="XXXXXXX" data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <section id="currencyListContainer" class="active">
        <div id="currencyList">
            <div class="currency-item">
                <span>USD/EUR</span>
                <span>0.85</span>
            </div>
            <div class="currency-item">
                <span>GBP/USD</span>
                <span>1.39</span>
            </div>
            <div class="currency-item">
                <span>JPY/GBP</span>
                <span>0.0073</span>
            </div>
        </div>
    </section>

    <section id="converter">
        <h2>Конвертер валют</h2>
        <label for="amount">Сумма:</label>
        <input type="number" id="amount" placeholder="Введите сумму">
        <label for="fromCurrency">Из:</label>
        <select id="fromCurrency"></select>
        <label for="toCurrency">В:</label>
        <select id="toCurrency"></select>
        <button onclick="convertCurrency()">Конвертировать</button>
        <p id="conversionResult"></p>
    </section>

    <section id="chartsContainer">
        <h2>График динамики доллара</h2>
        <canvas id="usdChart"></canvas>
    </section>

    <section id="contactsContainer">
        <h2>Контакты</h2>
        <p>Telegram: <a href="https://t.me/Artemonski16" target="_blank">@Artemonski16</a></p>
        <p>Telegram-канал: <a href="https://t.me/koder_16" target="_blank">@koder_16</a></p>
    </section>

    <div class="ad-banner">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="XXXXXXX" data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div id="footer">© 2025 CurrencyTracker</div>

    <div id="timer-info">Время с последнего обновления API: <span id="timer">0</span> секунд</div>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('section').forEach(section => {
                section.classList.remove('active');
            });
            const targetSection = document.getElementById(sectionId);
            targetSection.classList.add('active');
        }

        async function fetchExchangeRates() {
            try {
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const data = await response.json();
                updateCurrencyList(data.rates);
                populateCurrencyOptions(data.rates);
                updateChart(data);
                lastUpdate = new Date(); // Update the last update time
            } catch (error) {
                console.error('Ошибка при получении данных:', error);
            }
        }

        function updateCurrencyList(rates) {
            const currencyList = document.getElementById('currencyList');
            currencyList.innerHTML = '';
            Object.entries(rates).forEach(([currency, rate]) => {
                currencyList.innerHTML += `<div class="currency-item"><span>USD/${currency}</span><span>${rate.toFixed(2)}</span></div>`;
            });
        }

        function populateCurrencyOptions(rates) {
            const fromCurrency = document.getElementById('fromCurrency');
            const toCurrency = document.getElementById('toCurrency');
            [fromCurrency, toCurrency].forEach(select => select.innerHTML = Object.keys(rates).map(currency => `<option value="${currency}">${currency}</option>`).join(''));
        }

        function convertCurrency() {
            const amount = document.getElementById('amount').value;
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;

            if (!amount || !fromCurrency || !toCurrency) {
                document.getElementById('conversionResult').textContent = 'Пожалуйста, заполните все поля.';
                return;
            }

            fetch(`https://api.exchangerate-api.com/v4/latest/${fromCurrency}`)
                .then(response => response.json())
                .then(data => {
                    const rate = data.rates[toCurrency];
                    document.getElementById('conversionResult').textContent = `${amount} ${fromCurrency} = ${(amount * rate).toFixed(2)} ${toCurrency}`;
                })
                .catch(error => {
                    console.error('Ошибка при конвертации:', error);
                    document.getElementById('conversionResult').textContent = 'Ошибка при конвертации валют.';
                });
        }

        function updateChart(data) {
            new Chart(document.getElementById('usdChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: Object.keys(data.rates),
                    datasets: [{
                        label: 'USD Exchange Rate',
                        data: Object.values(data.rates),
                        borderColor: 'rgba(0, 123, 255, 1)',
                        backgroundColor: 'rgba(0, 123, 255, 0.2)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        x: {beginAtZero: true},
                        y: {beginAtZero: true}
                    }
                }
            });
        }

        let lastUpdate = new Date();
        let timerInterval;

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const currentTime = new Date();
                const timeElapsed = Math.floor((currentTime - lastUpdate) / 1000);
                document.getElementById('timer').textContent = timeElapsed;
            }, 1000);
        }

        window.onload = function() {
            fetchExchangeRates();
            startTimer();
            setInterval(fetchExchangeRates, 600000);
        };
    </script>
</body>
</html>
